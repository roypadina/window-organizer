name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open three Safari windows
        2. Press ⌃⌥⌘M
        3. ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.3"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Window Organizer version and install method
      placeholder: "0.1.0, Homebrew"
    validations:
      required: true
  - type: textarea
    id: apps
    attributes:
      label: Affected apps
      description: Which apps did not minimize / close / quit as expected? Include the bundle identifier from Settings → Apps if you can.
